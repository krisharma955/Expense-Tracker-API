name: Deploy to dev
on:
  push:
    branches: [ main ]

jobs:
  redeploy:
    runs-on: ubuntu-latest
    name: Redeploying the changes to the dev
    steps:
      - name: SSH into the Server
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key
          mkdir .ssh
          touch .ssh/known_hosts
          echo "${{ secrets.KNOWN_HOSTS }}" &> ~/.ssh/known_hosts
          chmod 700 /ssh_key
          ssh -i ~/ssh_key ubuntu@15.135.71.67 -t " cd Expense-Tracker-API/ && git pull origin main && export PATH=/home/ubuntu/.nvm/versions/node/v26.13.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin && mvn clean package -DskipTests && pm2 restart 0"