name: Deploy to dev
on:
  push:
    branches: [ main ]

jobs:
  redeploy:
    runs-on: ubuntu-latest
    name: Redeploying the changes to the dev
    steps:
      - name: SSH into the Server
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key
          mkdir -p /home/runner/.ssh
          touch /home/runner/.ssh/known_hosts
          echo "${{ secrets.KNOWN_HOSTS }}" &> /home/runner/.ssh/known_hosts
          chmod 700 /home/runner/ssh_key
          ssh -i ~/ssh_key ubuntu@15.135.71.67 -t " cd Expense-Tracker-API/ && git pull origin main && mvn clean package -DskipTests && pm2 restart 0"